[project]
name = "synapse-ai"
version = "0.1.0"
description = "Synapse AI Raman V0 reproducibility foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "streamlit>=1.39,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
inspect-dataset = "synapse_core.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.115,<7",
  "httpx>=0.27,<1",
  "pre-commit>=4,<5",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/synapse-core/src", "packages/synapse-api/src", "packages/synapse-ui/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["packages", "tests"]
exclude = ["notebooks"]
