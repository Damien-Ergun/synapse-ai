name: CI

on:
  push:
    branches: [main, "agent/**"]
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact implementation commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record verified commit SHA
        shell: pwsh
        run: |
          $expectedSha = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actualSha = git rev-parse HEAD

          Write-Output "EXPECTED_SHA=$expectedSha"
          Write-Output "VERIFIED_SHA=$actualSha"

          if ($actualSha -ne $expectedSha) {
            throw "Checked-out SHA $actualSha does not match expected SHA $expectedSha"
          }
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Check lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run canonical checks
        run: uv run --locked python scripts/run_checks.py
