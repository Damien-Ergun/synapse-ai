name: Apply Week 1 implementation payload

on:
  push:
    branches:
      - agent/week-1-foundation
    paths:
      - week1.apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/week-1-foundation
          fetch-depth: 0

      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          for part in .week1_payload/part00 .week1_payload/part01 .week1_payload/part02 .week1_payload/part03 .week1_payload/part04; do
            test -f "$part"
          done
          cat .week1_payload/part00 .week1_payload/part01 .week1_payload/part02 .week1_payload/part03 .week1_payload/part04 | base64 --decode > /tmp/week1_payload.tar.gz
          echo "3fe7199bee34af9a662ea672e3524402d2385f4695eb2a746a19d9fa93d380e8  /tmp/week1_payload.tar.gz" | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/week1_payload.tar.gz
          git config user.name "Damien Ergun"
          git config user.email "111133829+Damien-Ergun@users.noreply.github.com"
          git add -A
          git commit -m "Implement Week 1 foundation"
          git push origin HEAD:agent/week-1-foundation
