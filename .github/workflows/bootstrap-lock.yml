name: bootstrap-lock

on:
  push:
    branches: ["week1-foundation"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: week1-foundation
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv lock
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: generate uv lockfile"
          git push origin HEAD:week1-foundation
