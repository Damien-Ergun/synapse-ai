name: Bootstrap lock

on:
  push:
    branches: ["agent/week-1-foundation"]

permissions:
  contents: write

jobs:
  create-lock:
    if: ${{ hashFiles('uv.lock') == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/week-1-foundation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          python-version: "3.11.15"
      - name: Generate controlled lock and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          rm .github/workflows/bootstrap-lock.yml
          git config user.name "Damien Ergun"
          git config user.email "111133829+Damien-Ergun@users.noreply.github.com"
          git add uv.lock .github/workflows/bootstrap-lock.yml
          git commit -m "Add locked Week 1 environment"
          git push origin HEAD:agent/week-1-foundation
